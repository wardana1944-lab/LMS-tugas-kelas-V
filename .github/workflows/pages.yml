name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site and release metadata
        run: |
          mkdir _site
          find . -maxdepth 1 -type f \
            ! -name 'Backup 2025.html' \
            ! -name 'RB Patch 1.html' \
            ! -name 'build-info.js' \
            ! -name 'version.json' \
            -exec cp {} _site/ \;
          printf 'window.APP_BUILD_INFO = Object.freeze({ version: "%s" });\n' "$GITHUB_SHA" > _site/build-info.js
          printf '{"version":"%s","commit":"%s"}\n' "$GITHUB_SHA" "$GITHUB_SHA" > _site/version.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
