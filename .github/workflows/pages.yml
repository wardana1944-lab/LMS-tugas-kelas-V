name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site and release metadata
        run: |
          mkdir _site
          find . -maxdepth 1 -type f \
            ! -name 'Backup 2025.html' \
            ! -name 'RB Patch 1.html' \
            ! -name 'build-info.js' \
            ! -name 'version.json' \
            -exec cp {} _site/ \;
          DISPLAY_VERSION="$(jq -r '.displayName // .version // "Pembaruan"' version.json)"
          BUILD_INFO="$(jq -cn --arg version "$GITHUB_SHA" --arg displayName "$DISPLAY_VERSION" '{version: $version, displayName: $displayName}')"
          printf 'window.APP_BUILD_INFO = Object.freeze(%s);\n' "$BUILD_INFO" > _site/build-info.js
          jq -cn --arg version "$GITHUB_SHA" --arg displayName "$DISPLAY_VERSION" --arg commit "$GITHUB_SHA" '{version: $version, displayName: $displayName, commit: $commit}' > _site/version.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
